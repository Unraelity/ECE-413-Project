<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Browser tab title -->
    <title>Authentication Example - Display</title>

    <!-- Character encoding + responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS (for basic styling/layout) -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
    />

    <!-- jQuery is included (not strictly needed for this page unless you add JS later) -->
    <script
      type="text/javascript"
      src="https://code.jquery.com/jquery-3.6.0.min.js"
    ></script>
  </head>

  <body>
    <!-- Main Bootstrap container -->
    <div class="container">
      <!-- Link back to home page -->
      <a href="index.html" class="left brand-logo valign-wrapper">Home</a>
    </div>

    <!-- Page content area -->
    <div style="width:45vw; height: 60vh; margin: 2vh 10vw;">
      <!-- Unauthorized image shown when user isn't authenticated / token is missing -->
      <img
        src="images/401Unauthorized.jpg"
        alt="401 Unauthorized"
        width="100%"
        height="100%"
      />
    </div>
  </body>
</html>
