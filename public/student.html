<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Browser tab title -->
    <title>MongoDB CRUD Example</title>

    <!-- Character encoding + responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS (basic styling/layout) -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
    />

    <!-- jQuery (student.js likely uses $ / $.ajax for CRUD calls) -->
    <script
      type="text/javascript"
      src="https://code.jquery.com/jquery-3.6.0.min.js"
    ></script>

    <!-- Your client-side CRUD logic (button handlers + AJAX calls) -->
    <script src="javascripts/student.js"></script>
  </head>

  <body>
    <!-- Main Bootstrap container -->
    <div class="container">
      <!-- Link back to home page -->
      <a href="index.html" class="left brand-logo valign-wrapper">Home</a>

      <br />

      <!-- Page title -->
      <h1>MongoDB CRUD Example</h1>

      <br />

      <!-- Input form + action buttons -->
      <div>
        <!-- Name input -->
        <div>
          <label for="name">Name: </label>
          <input
            type="text"
            id="name"
            placeholder="Enter name"
            name="name"
          />
        </div>

        <!-- Major input -->
        <div>
          <label for="major">Major: </label>
          <!-- NOTE: "type='test'" is likely a typo and should be type="text" -->
          <input
            type="test"
            id="major"
            placeholder="Enter major"
            name="major"
          />
        </div>

        <!-- GPA input -->
        <div>
          <label for="gpa">GPA: </label>
          <input
            type="number"
            id="gpa"
            placeholder="Enter gpa"
            name="gpa"
          />
        </div>

        <br />

        <!-- CRUD + utility buttons.
             student.js should attach click handlers to each by ID. -->
        <button id="btnCreate">Create</button>
        <button id="btnRead">Read (using name)</button>
        <button id="btnUpdate">Update</button>
        <button id="btnDelete">Delete (using name)</button>
        <button id="btnCount">Get # of Students in DB</button>
        <button id="btnReadAll">Read all</button>
        <button id="btnSearch">Search (&gt; gpa)</button>
      </div>
    </div>

    <!-- Output panel to display server responses / debug text -->
    <div style="display:inline-block; width:45vw; height: 60vh; margin: 2vh 20vw;">
      <label for="rxData">Message: </label>

      <!-- student.js likely writes JSON/text into this textarea -->
      <textarea id="rxData" style="width:100%; height:100%"></textarea>
    </div>
  </body>
</html>
